name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install tools
        run: make tool-golangci-lint tool-betteralign

      - name: Check
        run: make check FUZZTIME=10s

      - name: Check (pure Go fallback)
        run: go test -tags purego ./...
